# TASK F (aug20, OPTIONAL, run only after Task D): 7B GRPO identical to the
# reported run in every respect except kl_beta 0.01 (10x the reported 0.001,
# a conventional value). Same lr, K, temperature, LoRA, epochs, warm start,
# seed. New output/ckpt paths so nothing existing is touched (guardrail 7).
model_config: configs/model/qwen2.5-7b.yaml
split_dir: data/splits
init_adapter: artifacts/sft-7b          # same SFT warm start as the reported run
output_dir: artifacts/grpo-7b-beta01
seed: 0                                  # same seed as reported seed 0
load_in_4bit: true
gradient_checkpointing: true

lora:
  r: 16
  alpha: 32

reward:
  format_reward: 0.1
  grouping_weight: 1.0
  solve_bonus: 0.5
  one_away_credit: 0.05
  invalid_penalty: -0.1

num_generations: 8
temperature: 0.9
kl_beta: 0.01                            # << the ONLY hyperparameter change
lr: 5.0e-6
batch_size: 2
grad_accum: 8
epochs: 1
max_prompt_length: 512
max_completion_length: 512
logging_steps: 5
save_steps: 50                           # checkpoint cadence as the original
ckpt_hub_repo: connections-rl-grpo-7b-beta01-ckpt
wandb: true
run_name: connections-rl-grpo-qwen7b-beta01
