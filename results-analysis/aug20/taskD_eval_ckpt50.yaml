# TASK D (aug20): step-50 7B GRPO checkpoint on the TEST split, greedy,
# with base and final GRPO measured IN THE SAME vLLM SESSION so every
# comparison below is within-session (guardrail 2).
# Launch per results-analysis/aug20/TASKD_RUNBOOK.md.
puzzles: data/splits/puzzles_test.json
out_dir: results-analysis/aug20/taskD-session
n_resamples: 1000
seed: 0

arms:
  - name: base
    model: Qwen/Qwen2.5-7B-Instruct
    temperature: 0.0
  - name: grpo-ckpt50
    model: connections-rl-grpo-7b-ckpt50   # vLLM --lora-modules name, see runbook
    temperature: 0.0
  - name: grpo-final
    model: connections-rl-grpo-7b          # final seed-0 adapter, same session
    temperature: 0.0
