# B1 (aug21): identical to the reported 7B GRPO run except scale_rewards=false.
# Requires the one-line grpo.py patch in taskB1_grpo_scale_rewards.patch —
# without it the key is silently ignored and this run replicates the original.
model_config: configs/model/qwen2.5-7b.yaml
split_dir: data/splits
init_adapter: artifacts/sft-7b          # same SFT warm start
output_dir: artifacts/grpo-7b-noscale
seed: 0
load_in_4bit: true
gradient_checkpointing: true

lora: { r: 16, alpha: 32 }

reward:
  format_reward: 0.1
  grouping_weight: 1.0
  solve_bonus: 0.5
  one_away_credit: 0.05
  invalid_penalty: -0.1

num_generations: 8
temperature: 0.9
kl_beta: 0.001
lr: 5.0e-6
batch_size: 2
grad_accum: 8
epochs: 1
max_prompt_length: 512
max_completion_length: 512
logging_steps: 5
save_steps: 50
scale_rewards: false                     # << the ONLY change vs the reported run
ckpt_hub_repo: connections-rl-grpo-7b-noscale-ckpt
wandb: true
run_name: connections-rl-grpo-qwen7b-noscale
