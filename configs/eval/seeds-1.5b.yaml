# Multi-seed 1.5B eval: seed 0 (published) vs seeds 1-2, same held-out test split.
puzzles: data/splits/puzzles_test.json
out_dir: results-seeds-1.5b
n_resamples: 1000
seed: 0

arms:
  - name: sft
    model: connections-rl-sft
    temperature: 0.0
  - name: grpo-seed0
    model: connections-rl-grpo
    temperature: 0.0
  - name: grpo-seed1
    model: connections-rl-grpo-1.5b-seed1
    temperature: 0.0
  - name: grpo-seed2
    model: connections-rl-grpo-1.5b-seed2
    temperature: 0.0
